# Builds HORIX (apps/sg-ps) and publishes it to https://horix.live/ and the download
# page to https://horix.si/ on every push to the default
# branch that touches the app. Needs the repository secret HOSTINGER_API_TOKEN
# (hPanel > Account > API). Optional repository variables: HOSTINGER_USERNAME, HORIX_EDITOR_DOMAIN,
# HORIX_DOWNLOAD_DOMAIN, HORIX_LEGACY_DOMAIN,
# HORIX_OLD_DOMAIN (the old address that now redirects; studio.engsaber.space).
name: Deploy HORIX

on:
  push:
    paths:
      - "apps/sg-ps/**"
      - "archive/photocraft/**"
      - ".github/workflows/deploy-sg-ps.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-sg-ps
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch goes live; pushes to other branches don't deploy.
    if: github.ref_name == github.event.repository.default_branch
    # GitHub's hosted runner builds by default (free for a public repository). Set the repository
    # variable HORIX_RUNNER=mac to build on the team's Mac (self-hosted runner labelled horix-mac).
    runs-on: ${{ vars.HORIX_RUNNER == 'mac' && fromJSON('["self-hosted", "horix-mac"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      # HORIX's version is apps/sg-ps/VERSION plus this build number (0.2.57); see CHANGELOG.md.
      HORIX_BUILD_NUMBER: ${{ github.run_number }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.sgps-target
      SGPS_WORK: ${{ github.workspace }}/.sgps-build
      HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME || 'u570689065' }}
      HORIX_EDITOR_DOMAIN: ${{ vars.HORIX_EDITOR_DOMAIN || 'horix.live' }}
      HORIX_DOWNLOAD_DOMAIN: ${{ vars.HORIX_DOWNLOAD_DOMAIN || 'horix.si' }}
      HORIX_LEGACY_DOMAIN: ${{ vars.HORIX_LEGACY_DOMAIN || 'sabergroupacademy.com' }}
      HORIX_OLD_DOMAIN: ${{ vars.HORIX_OLD_DOMAIN || 'studio.engsaber.space' }}
      HORIX_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # A self-hosted Mac runs as a background service with a short PATH: add Rust and Homebrew.
      - name: PATH on the Mac
        if: runner.os == 'macOS'
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true

      - name: Check the deploy secret
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "::error::Add the repository secret HOSTINGER_API_TOKEN (hPanel > Account > API) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Brotli (pre-compressed WebAssembly)
        run: |
          if command -v brotli >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install brotli; else sudo apt-get install -y --no-install-recommends brotli; fi

      # Select Subject on the web: fetch.py converts IS-Net to half precision with onnxruntime's
      # converter.
      - name: ONNX tools for the web model
        run: python3 -m pip install --user --quiet "onnx>=1.17" "onnxruntime>=1.20"

      - name: Install trunk
        run: |
          if ! command -v trunk >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install trunk
            else curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin trunk; fi
          fi
          trunk --version

      # Compiled dependencies are reused between runs: the first build takes ~25 min, later ones
      # only rebuild what rebrand.py changed.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/trunk
            .sgps-target
          key: sgps-${{ runner.os }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-${{ hashFiles('apps/sg-ps/**') }}
          restore-keys: |
            sgps-${{ runner.os }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-

      - name: Build
        env:
          # Optional: n8n webhook that alerts the team on Telegram for each waitlist lead.
          SGPS_LEAD_WEBHOOK: ${{ secrets.SGPS_LEAD_WEBHOOK }}
        run: apps/sg-ps/build.sh

      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: apps/sg-ps/deploy.sh

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: sg-ps-hostinger
          path: deploy/sg-ps/*.zip
          retention-days: 14
