# Builds the web versions of Horix Vectors (apps/horix-vectors, rebranded VectorCraft), Horix
# Light (apps/horix-light, rebranded LightCraft) and Horix Layout (apps/horix-layout, rebranded
# DesignCraft), keeps each zip as a build artifact, and on the default branch publishes them to
# https://vectors.horix.live/, https://light.horix.live/ and https://layout.horix.live/.
# Needs the repository secret HOSTINGER_API_TOKEN (the same one HORIX uses). The first deploy
# creates each subdomain through the Hostinger API (ensure-subdomain.sh). Optional repository
# variables: HORIX_VECTORS_DOMAIN, HORIX_LIGHT_DOMAIN, HORIX_LAYOUT_DOMAIN, and, to upload somewhere else than where the
# subdomain was found, HORIX_<APP>_UPLOAD_DOMAIN and HORIX_<APP>_UPLOAD_DIR.
name: Build Horix Vectors, Light and Layout

on:
  push:
    paths:
      - "apps/horix-common/**"
      - "apps/horix-vectors/**"
      - "apps/horix-light/**"
      - "apps/horix-layout/**"
      - "archive/vectorcraft/**"
      - "archive/lightcraft/**"
      - "archive/designcraft/**"
      - "apps/sg-ps/ai/fetch.py"
      - ".github/workflows/build-horix-family.yml"
  workflow_dispatch:

concurrency:
  group: build-horix-family-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: vectors, up: vectorcraft }
          - { app: light, up: lightcraft }
          - { app: layout, up: designcraft }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.horix-target-${{ matrix.app }}
      HORIX_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Brotli (pre-compressed WebAssembly)
        run: command -v brotli >/dev/null || sudo apt-get install -y --no-install-recommends brotli

      - name: trunk (Horix Vectors, Horix Layout)
        if: matrix.app != 'light'
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: wasm-bindgen CLI at the version in Cargo.lock (Horix Light)
        if: matrix.app == 'light'
        run: |
          v="$(tar -xzOf archive/lightcraft/lightcraft-source-*.tar.gz --wildcards '*/Cargo.lock' | grep -A1 '^name = "wasm-bindgen"$' | sed -n 's/version = "\(.*\)"/\1/p')"
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo cp "wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: HORIX AI models (Horix Light; IS-Net is converted to half precision)
        if: matrix.app == 'light'
        run: python3 -m pip install --user --quiet "onnx>=1.17" "onnxruntime>=1.20"

      - uses: actions/cache@v4
        with:
          path: |
            .sgps-build/ai-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/trunk
            .horix-target-${{ matrix.app }}
          key: horix-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('archive/{0}/*.tar.gz', matrix.up)) }}-${{ hashFiles('apps/horix-common/**', format('apps/horix-{0}/**', matrix.app)) }}
          restore-keys: |
            horix-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles(format('archive/{0}/*.tar.gz', matrix.up)) }}-

      - name: Build
        run: apps/horix-${{ matrix.app }}/build.sh

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: horix-${{ matrix.app }}-web
          path: deploy/horix-${{ matrix.app }}/*.zip
          retention-days: 30

      - name: Subdomain on Hostinger
        if: github.ref_name == github.event.repository.default_branch
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME || 'u570689065' }}
          DOMAIN: ${{ matrix.app == 'vectors' && (vars.HORIX_VECTORS_DOMAIN || 'vectors.horix.live') || matrix.app == 'light' && (vars.HORIX_LIGHT_DOMAIN || 'light.horix.live') || (vars.HORIX_LAYOUT_DOMAIN || 'layout.horix.live') }}
          SET_UPLOAD_DOMAIN: ${{ matrix.app == 'vectors' && vars.HORIX_VECTORS_UPLOAD_DOMAIN || matrix.app == 'light' && vars.HORIX_LIGHT_UPLOAD_DOMAIN || matrix.app == 'layout' && vars.HORIX_LAYOUT_UPLOAD_DOMAIN || '' }}
          SET_UPLOAD_DIR: ${{ matrix.app == 'vectors' && vars.HORIX_VECTORS_UPLOAD_DIR || matrix.app == 'light' && vars.HORIX_LIGHT_UPLOAD_DIR || matrix.app == 'layout' && vars.HORIX_LAYOUT_UPLOAD_DIR || '' }}
        run: |
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          if [ -n "$SET_UPLOAD_DOMAIN" ]; then
            printf 'UPLOAD_DOMAIN=%s\nUPLOAD_DIR=%s\n' "$SET_UPLOAD_DOMAIN" "$SET_UPLOAD_DIR" >> "$GITHUB_ENV"
          else
            # Creates the subdomain on the first deploy (folder inside horix.live), then finds it.
            apps/horix-common/ensure-subdomain.sh "$DOMAIN" "${DOMAIN#*.}" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Hostinger
        if: github.ref_name == github.event.repository.default_branch
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ vars.HOSTINGER_USERNAME || 'u570689065' }}
        run: |
          zip="$(ls -t deploy/horix-${{ matrix.app }}/*.zip | head -1)"
          apps/horix-common/deploy-static.sh "$zip" "horix-${{ matrix.app }}" "$DOMAIN"
