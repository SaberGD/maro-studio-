# Builds the HORIX desktop app for Windows (portable zip) and macOS (universal .app in a zip) and
# publishes them as a GitHub Release, which HORIX Launcher installs from (horix.si offers only the
# launcher). Run it from
# the Actions tab (Run workflow), or push a tag named desktop-v* (for example desktop-v0.3.0).
name: Desktop HORIX

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    # GitHub's hosted runners build both platforms (free for a public repository). Repository
    # variable HORIX_RUNNER=mac moves the macOS build to the team's Mac (self-hosted, horix-mac).
    runs-on: ${{ (matrix.target == 'macos' && vars.HORIX_RUNNER == 'mac') && fromJSON('["self-hosted", "horix-mac"]') || matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # HORIX's version is apps/sg-ps/VERSION plus this build number (0.2.57); see CHANGELOG.md.
      HORIX_BUILD_NUMBER: ${{ github.run_number }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.sgps-target
      SGPS_WORK: ${{ github.workspace }}/.sgps-build
    steps:
      - uses: actions/checkout@v4

      # A self-hosted Mac runs as a background service with a short PATH: add Rust and Homebrew.
      - name: PATH on the Mac
        if: runner.os == 'macOS'
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.target }}" = macos ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sgps-target
          key: sgps-desktop-${{ matrix.target }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-${{ hashFiles('apps/sg-ps/**') }}
          restore-keys: |
            sgps-desktop-${{ matrix.target }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-

      - name: Build and package
        run: apps/sg-ps/desktop/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: sg-ps-desktop-${{ matrix.target }}
          path: |
            deploy/sg-ps-desktop/*.zip
            deploy/sg-ps-desktop/*.dmg
          retention-days: 30

  release:
    needs: build
    # Publish whatever built: a Windows build that could not run (no hosted minutes) must not hold
    # back the Mac one.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.HORIX_RUNNER == 'mac' && fromJSON('["self-hosted", "horix-mac"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/sg-ps

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # horix-v<version>: the tag HORIX Launcher reads (apps/horix-launcher/feed/make_feed.py).
      - name: Release tag
        run: |
          VERSION="$(tr -d '[:space:]' < apps/sg-ps/VERSION).${{ github.run_number }}"
          echo "TAG=horix-v$VERSION" >> "$GITHUB_ENV"

      # The release HORIX Launcher installs and updates from (the repository is public).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::no desktop zip was built"; exit 1; }
          # Checksums of every file: HORIX Launcher verifies its downloads against them.
          # (A platform that failed to build is simply absent: nullglob drops its pattern.)
          shopt -s nullglob
          (cd dist && sha256sum -- *.zip *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)
          files=(dist/*.zip dist/*.dmg dist/SHA256SUMS.txt)
          gh release create "$TAG" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HORIX Desktop ($TAG)" \
            --notes "HORIX desktop app.

          Windows: download HORIX-...-windows-x64.zip, unzip it, and run HORIX.exe. On the first run Windows may show \"Windows protected your PC\": click More info > Run anyway.

          macOS (Apple Silicon and Intel): download HORIX-...-macos-universal.zip, unzip it, and drag \"HORIX\" into Applications. On the first run macOS says it could not verify the app (it is not notarized yet): click Done, then System Settings > Privacy & Security > Open Anyway next to HORIX, and enter your password."

  # HORIX Launcher learns about the new release at once.
  feed:
    needs: release
    uses: ./.github/workflows/horix-feed.yml
    secrets: inherit
