# Builds the HORIX desktop app for Windows (portable zip) and macOS (universal .app in a zip),
# publishes both on engsaber.space/sgps-downloads/ (the download page at
# sabergroupacademy.com/downloads/ links there) and keeps a copy as a GitHub Release. Run it from
# the Actions tab (Run workflow), or push a tag named desktop-v* (for example desktop-v0.3.0).
name: Desktop HORIX

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    # GitHub's hosted runners build both platforms (free for a public repository). Repository
    # variable HORIX_RUNNER=mac moves the macOS build to the team's Mac (self-hosted, horix-mac).
    runs-on: ${{ (matrix.target == 'macos' && vars.HORIX_RUNNER == 'mac') && fromJSON('["self-hosted", "horix-mac"]') || matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # HORIX's version is apps/sg-ps/VERSION plus this build number (0.2.57); see CHANGELOG.md.
      HORIX_BUILD_NUMBER: ${{ github.run_number }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.sgps-target
      SGPS_WORK: ${{ github.workspace }}/.sgps-build
    steps:
      - uses: actions/checkout@v4

      # A self-hosted Mac runs as a background service with a short PATH: add Rust and Homebrew.
      - name: PATH on the Mac
        if: runner.os == 'macOS'
        run: |
          for d in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          true

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.target }}" = macos ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .sgps-target
          key: sgps-desktop-${{ matrix.target }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-${{ hashFiles('apps/sg-ps/**') }}
          restore-keys: |
            sgps-desktop-${{ matrix.target }}-${{ hashFiles('archive/photocraft/*.tar.gz') }}-

      - name: Build and package
        run: apps/sg-ps/desktop/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: sg-ps-desktop-${{ matrix.target }}
          path: deploy/sg-ps-desktop/*.zip
          retention-days: 30

  release:
    needs: build
    # Publish whatever built: a Windows build that could not run (no hosted minutes) must not hold
    # back the Mac one. publish.sh keeps the previous entry for a platform that has no new zip.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.HORIX_RUNNER == 'mac' && fromJSON('["self-hosted", "horix-mac"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/sg-ps

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in desktop-v*) ;; *) TAG="desktop-build-${{ github.run_number }}" ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The public download page (sabergroupacademy.com/downloads/) serves these files.
      - name: Publish on engsaber.space
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: apps/sg-ps/desktop/publish.sh dist "$TAG"

      # Archive copy on GitHub (the repository is private: only members can download these).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::no desktop zip was built"; exit 1; }
          gh release create "$TAG" dist/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HORIX Desktop ($TAG)" \
            --notes "HORIX desktop app.

          Windows: download HORIX-...-windows-x64-portable.zip, unzip it, and run HORIX.exe. On the first run Windows may show \"Windows protected your PC\": click More info > Run anyway.

          macOS (Apple Silicon and Intel): download HORIX-...-macos-universal.zip, unzip it, and drag \"HORIX\" into Applications. On the first run macOS says it could not verify the app (it is not notarized yet): click Done, then System Settings > Privacy & Security > Open Anyway next to HORIX, and enter your password."
