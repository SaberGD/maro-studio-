const fmt = (v, f) => (Math.abs(f.to - f.from) < 10 && !Number.isInteger(f.to) ? v.toFixed(2) : v.toFixed(1));

function show(e, on) { e.style.display = on ? 'block' : 'none'; }

function logo(t) {
  // Intro: the HORIX loading screen (default-theme neutral, amber bar), stepping on the beats; eye opens on 3.57.
  // End: the same lockup, already lit.
  const L = $('#logo');
  const intro = t < 4.2, end = t >= 53.9;
  show(L, intro || end);
  if (!intro && !end) return;
  const mk = L.querySelector('.mk'), vw = 1334;
  if (intro) {
    const steps = [[0.69, 0.14], [1.17, 0.3], [1.65, 0.46], [2.13, 0.62], [2.61, 0.78], [3.09, 1]];
    let p = 0, prev = 0;
    for (const [ts, v] of steps) { if (t < ts) break; p = mix(prev, v, k(t, ts, ts + 0.14)); prev = v; }
    $('#hx_wipe').setAttribute('width', String(vw * p + 2));
    $('#lBar').style.width = (p * 100).toFixed(1) + '%';
    $('#lStatus').innerHTML = t < 3.57 ? (p < 1 ? `بنحمّل HORIX… <span dir="ltr">${Math.floor(p * 100)}%</span>` : 'بنجهّز الأدوات…') : 'جاهز';
    const eo = k(t, 3.57, 3.95, E.outBack);
    $('#hxEye').style.transform = `scaleY(${mix(0.12, 1, eo)})`;
    $('#hxEye').style.opacity = mix(0.5, 1, k(t, 3.57, 3.7));
    const inn = k(t, 0, 0.5);
    const out = k(t, 3.85, 4.15, E.inCubic);
    L.style.opacity = inn * (1 - out);
    mk.style.transform = `scale(${mix(0.94, 1, inn) * (1 + 0.05 * k(t, 3.57, 3.8, E.outExpo)) * (1 + 0.25 * out)})`;
    for (const id of ['#lTrack', '#lStatus']) $(id).style.opacity = 1 - k(t, 3.6, 3.8);
    $('#lDesc').style.opacity = 1;
    $('#lDesc').style.top = '740px';
  } else {
    const t0 = 53.958;
    $('#hx_wipe').setAttribute('width', String(vw * k(t, t0, t0 + 0.9, E.inOutCubic) + 2));
    const eo = k(t, t0 + 0.96, t0 + 1.3, E.outBack);
    $('#hxEye').style.transform = `scaleY(${mix(0.12, 1, eo)})`;
    $('#hxEye').style.opacity = 1;
    L.style.opacity = k(t, t0, t0 + 0.3) * (1 - k(t, 59.2, 59.636));
    mk.style.transform = `translateY(-70px) scale(${0.82 * (1 + 0.05 * Math.exp(-Math.max(0, t - HIT) * 6) * (t > HIT ? 1 : 0))})`;
    for (const id of ['#lTrack', '#lStatus']) $(id).style.opacity = 0;
    $('#lDesc').style.top = '640px';
    $('#lDesc').style.opacity = k(t, t0 + 1.0, t0 + 1.5) * (1 - k(t, 59.2, 59.636));
  }
}

function intro2(t) {
  const s = $('#s1'), t0 = 4.05, t1 = 7.89;
  show(s, t >= t0 - 0.05 && t < t1 + 0.1);
  if (s.style.display === 'none') return;
  s.style.opacity = k(t, t0 - 0.05, t0 + 0.2) * (1 - k(t, t1 - 0.12, t1 + 0.05));
  $('#s1 .kick').style.opacity = k(t, t0, t0 + 0.4);
  $('#s1 .kick').style.letterSpacing = mix(0.8, 0.42, k(t, t0, t0 + 1.2, E.outExpo)) + 'em';
  revealWords(h1w, t, t0 + 0.48, 0.24, 0.5);
  revealWords(h2w, t, t0 + 1.92, 0.24, 0.5);
  const sc = 1 + punch(t, 0.012);
  $('#h1').style.transform = $('#h2').style.transform = `scale(${sc})`;
  $('#s1 .row').style.opacity = k(t, t0 + 0.9, t0 + 1.4);
  $('#mq').style.transform = `translateX(${-200 - (t - t0) * 160}px)`;
}

function feat(f, t) {
  const on = t >= f.t0 - 0.05 && t < f.t1 + 0.1;
  show(f.el, on);
  if (!on) return;
  const t0 = f.t0, d = f.t1 - f.t0, s = f.el;
  s.style.opacity = k(t, t0 - 0.05, t0 + 0.15) * (1 - k(t, f.t1 - 0.12, f.t1 + 0.05));
  const m = s.querySelector('.media'), x = k(t, t0, t0 + 0.6, E.outExpo);
  m.style.transform = `translateX(${(1 - x) * -80}px) scale(${(1 + punch(t, 0.008)) * mix(1, 1.025, (t - t0) / d)})`;
  m.style.opacity = x;
  const txt = s.querySelector('.txt'), tx = k(t, t0 + 0.08, t0 + 0.7, E.outExpo);
  txt.style.transform = `translateX(${(1 - tx) * 60}px)`;
  txt.style.opacity = tx;
  s.querySelector('.nm').style.letterSpacing = mix(0.06, -0.02, k(t, t0, t0 + 0.8, E.outExpo)) + 'em';
  revealWords(f.words, t, t0 + 0.3, 0.06, 0.45);
  s.querySelector('.tag').style.opacity = k(t, t0 + 0.5, t0 + 0.8);
  const rev = t0 + 0.96; // second half-bar: the "after" lands on a beat
  if (f.kind === 'pair') {
    const cs = s.querySelectorAll('.card');
    cs[0].style.opacity = k(t, t0 + 0.1, t0 + 0.4);
    cs[0].style.transform = `translateY(${(1 - k(t, t0 + 0.1, t0 + 0.6, E.outExpo)) * 40}px)`;
    const a = k(t, rev, rev + 0.45, E.outExpo);
    cs[1].style.opacity = a;
    cs[1].style.transform = `translateY(${(1 - a) * 60}px) scale(${1 + punch(t, 0.01) * (t > rev ? 1 : 0)})`;
    s.querySelectorAll('.zoom').forEach((z, j) => {
      const zz = k(t, t0 + 1.92 + j * 0.24, t0 + 2.3 + j * 0.24, E.outBack);
      z.style.transform = `scale(${zz})`; z.style.opacity = zz > 0 ? 1 : 0;
    });
  } else if (f.kind === 'cmp') {
    const p = k(t, rev, rev + 1.2, E.inOutCubic);
    const c = s.querySelector('.cmp');
    c.querySelector('.aft').style.clipPath = `inset(0 ${(p * 100).toFixed(2)}% 0 0)`;
    // divider travels right-to-left (Arabic reading direction): after-image grows from the left
    c.querySelector('.aft').style.clipPath = `inset(0 ${((1 - p) * 100).toFixed(2)}% 0 0)`;
    const dv = c.querySelector('.div');
    dv.style.left = (p * 100).toFixed(2) + '%';
    dv.style.opacity = p > 0 && p < 1 ? 1 : 0;
    c.querySelector('.ca').style.opacity = k(t, rev + 1.0, rev + 1.3);
    c.querySelector('.cl').style.opacity = 1 - k(t, rev + 0.6, rev + 1.0);
    const ins = s.querySelector('.ins');
    if (ins) { const z = k(t, t0 + 2.4, t0 + 2.85, E.outBack); ins.style.transform = `scale(${z}) rotate(${mix(-6, -2, z)}deg)`; ins.style.opacity = z > 0 ? 1 : 0; }
  } else if (f.kind === 'stack') {
    const cs = Array.from(s.querySelectorAll('.stk')), n = cs.length;
    const per = (d - 0.3) / n;
    cs.forEach((c, j) => {
      const a = k(t, t0 + j * per, t0 + j * per + 0.45, E.outExpo);
      const gone = j < n - 1 ? k(t, t0 + (j + 1) * per, t0 + (j + 1) * per + 0.45, E.outExpo) : 0;
      c.style.opacity = a;
      c.style.transform = `translate(${(1 - a) * -120 + gone * 40}px, ${gone * -30}px) scale(${1 - gone * 0.06})`;
      c.style.filter = `brightness(${1 - gone * 0.5})`;
      c.style.zIndex = j;
    });
    const ex = s.querySelector('.ext');
    if (ex) { const z = k(t, t0 + 2.4, t0 + 2.85, E.outBack); ex.style.transform = `scale(${z})`; ex.style.opacity = z > 0 ? 1 : 0; ex.style.zIndex = 9; }
  } else {
    const c = s.querySelector('.card'), a = k(t, t0 + 0.1, t0 + 0.6, E.outExpo);
    c.style.opacity = a; c.style.transform = `translateY(${(1 - a) * 50}px)`;
  }
  if (f.from != null) {
    const p = k(t, rev, rev + 1.1, E.outCubic);
    const v = mix(f.from, f.to, p);
    s.querySelector('.cnt').textContent = fmt(v, f) + (f.unitless ? '' : '%');
    s.querySelector('.big small').style.opacity = k(t, rev + 1.0, rev + 1.3);
    const st = s.querySelector('.stat');
    st.style.opacity = k(t, t0 + 0.4, t0 + 0.8);
    const fl = s.querySelectorAll('.fl');
    fl[0].style.width = (+fl[0].dataset.w * k(t, t0 + 0.5, t0 + 1.0)) + '%';
    fl[1].style.width = (+fl[1].dataset.w * k(t, rev, rev + 1.1)) + '%';
    s.querySelector('.note').style.opacity = k(t, rev + 1.2, rev + 1.6);
  } else {
    s.querySelectorAll('.pt').forEach((p, j) => {
      const a = k(t, t0 + 0.96 + j * 0.48, t0 + 1.4 + j * 0.48, E.outExpo);
      p.style.opacity = a; p.style.transform = `translateX(${(1 - a) * 40}px)`;
    });
  }
}

function climax(t) {
  const c = $('#cx'), t0 = 42.438, t1 = 53.958;
  show(c, t >= t0 - 0.05 && t < t1 + 0.1);
  if (c.style.display === 'none') return;
  c.style.opacity = k(t, t0 - 0.05, t0 + 0.1) * (1 - k(t, t1 - 0.15, t1 + 0.05));
  $('#coll').style.transform = `translate(${-(t - t0) * 14}px, ${-(t - t0) * 9}px) scale(${1.05 + punch(t, 0.02)})`;
  const dots = $$('#dots i');
  STATS.forEach((s, i) => {
    const on = t >= s.t0 && t < s.t1;
    show(s.el, on);
    dots[i].className = t >= s.t0 ? 'on' : '';
    if (!on) return;
    const p = k(t, s.t0, s.t0 + 0.45, E.outExpo);
    s.el.querySelector('.cnt').textContent = Number.isInteger(s.v) ? Math.round(s.v * p) : (s.v * p).toFixed(1);
    const n = s.el.querySelector('.n');
    n.style.transform = `scale(${mix(1.25, 1, p) * (1 + punch(t, 0.03))})`;
    n.style.opacity = p;
    n.style.filter = `blur(${(1 - p) * 12}px)`;
    const u = s.el.querySelector('.u'), ua = k(t, s.t0 + 0.12, s.t0 + 0.5, E.outExpo);
    u.style.opacity = ua; u.style.letterSpacing = mix(0.3, -0.01, ua) + 'em';
    revealWords(s.words, t, s.t0 + 0.3, 0.06, 0.4);
    s.el.querySelector('.r').style.opacity = k(t, s.t0 + 0.5, s.t0 + 0.8);
    s.el.style.opacity = 1 - k(t, s.t1 - 0.1, s.t1);
  });
}

function endCard(t) {
  const e = $('#end'), t0 = 53.958;
  show(e, t >= t0);
  if (t < t0) return;
  const l1 = $('#end .line1'), a = k(t, t0 + 1.44, t0 + 1.9, E.outExpo);
  l1.style.opacity = a; l1.style.letterSpacing = mix(0.6, 0.32, a) + 'em';
  revealWords(endw, t, t0 + 1.92, 0.08, 0.45);
  const u = k(t, t0 + 2.4, t0 + 2.8); $('#end .url').style.opacity = u;
  $$('#end .pl span').forEach((sp, j) => { const z = k(t, t0 + 2.6 + j * 0.12, t0 + 3.0 + j * 0.12, E.outBack); sp.style.opacity = z; sp.style.transform = `translateY(${(1 - z) * 20}px)`; });
  $('#end .by').style.opacity = k(t, t0 + 2.9, t0 + 3.3);
  e.style.opacity = 1 - k(t, 59.25, 59.636);
}

const CUTS = [4.05, ...FEATS.map((f) => f.t0), 42.438, 53.958];
function fx(t) {
  // amber scan line sweeps across on each scene cut — the "vision" beam
  let x = -60;
  for (const c of CUTS) if (t > c - 0.14 && t < c + 0.22) x = mix(-60, 1980, k(t, c - 0.14, c + 0.22, E.inOutCubic));
  $('#scan').style.left = x + 'px';
  $('#flash').style.opacity = 0.22 * Math.exp(-Math.max(0, t - HIT) * 5) * (t >= HIT ? 1 : 0) + 0.12 * Math.exp(-Math.max(0, t - 42.438) * 6) * (t >= 42.438 ? 1 : 0);
  const hud = k(t, 4.0, 4.4) * (1 - k(t, 53.8, 54.0));
  $('#hudL').style.opacity = $('#hudR').style.opacity = hud;
  $('#progBar').style.width = (clamp((t - 4.05) / (53.958 - 4.05), 0, 1) * 100) + '%';
  $('#prog').style.opacity = hud;
  $('#glow').style.transform = `translate(${Math.sin(t * 0.3) * 120}px, ${Math.cos(t * 0.23) * 60}px) scale(${1 + punch(t, 0.05)})`;
  $('#grid').style.backgroundPosition = `${-t * 6}px ${12 - t * 3}px`;
}

window.render = (t) => { logo(t); intro2(t); FEATS.forEach((f) => feat(f, t)); climax(t); endCard(t); fx(t); };
Promise.all([document.fonts.ready, ...Array.from(document.images).map((i) => i.decode().catch(() => {}))]).then(() => {
  render(0); window.READY = true;
});
</script>
