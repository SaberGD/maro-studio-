:root { --ink: #141314; --amber: #EA993F; --red: #D63C32; --ivory: #F3EFE8; }

.ar { direction: rtl; font-weight: 900; }
.red { color: var(--red); }

#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.word { display: inline-block; white-space: nowrap; }
.line { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; white-space: nowrap; }
.stack { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; }
.stack .word { display: block; }
.win { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 50px 140px rgba(0,0,0,.7), 0 0 0 1px rgba(243,239,232,.10); background: #0d0c0d; }

.chip { position: absolute; padding: 18px 40px; border-radius: 16px; background: var(--ivory); color: var(--ink); font-size: 64px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }

const SW = 1080, SH = 1920;

const CLAPS = [0.365, 0.835, 1.19, 1.54, 1.89, 2.245, 2.73, 3.065, 3.415];

const SEQ = [[9.4, 'fix/11-open.png'], [10.105, 'fix/hd-cmd.png'], [10.455, 'fix/12-subject.png'], [10.8, 'fix/14-cutout.png'],
  [11.285, 'fix/15-both.png'], [11.865, 'fix/16-hs-open.png'], [12.215, 'fix/17-hs-hue.png', 0.25], [12.48, 'fix/18-final.png']];

const show = (id, on) => { const el = document.getElementById(id); el.style.display = on ? 'block' : 'none'; return on; };
const flashAt = (t, times, dur, amt) => { let v = 0; for (const x of times) if (t >= x && t < x + dur) v = Math.max(v, amt * (1 - (t - x) / dur)); return v; };
const punch = (t, t0, amt) => (t < t0 ? 0 : amt * Math.exp(-(t - t0) * 9) * Math.cos((t - t0) * 18));
const pop = (el, t, t0, from) => { const x = k(t, t0, t0 + 0.22, E.outBack); el.style.opacity = clamp((t - t0) / 0.06, 0, 1); el.style.transform = `scale(${mix(from || 1.6, 1, x)})`; el.style.filter = `blur(${(1 - k(t, t0, t0 + 0.16)) * 14}px)`; };
const wordsIn = (sel, t, times, from) => $$(sel + ' .word').forEach((w, i) => {
  const blockish = w.parentElement.classList.contains('stack');
  if (t < times[i]) { w.style.display = 'none'; return; }
  w.style.display = blockish ? 'block' : 'inline-block'; pop(w, t, times[i], from);
});

  set('#b1', { width: '900px', height: '900px', left: `${-200 + 220 * Math.sin(t * 0.35)}px`, top: `${500 + 200 * Math.cos(t * 0.4)}px`, background: 'rgba(214,60,50,.55)', opacity: 0.55 * amt });

  set('#b3', { width: '520px', height: '520px', left: `${500 + 220 * Math.sin(t * 0.5)}px`, top: `${200 + 100 * Math.sin(t * 0.7)}px`, background: 'rgba(234,153,63,.35)', opacity: 0.35 * amt });
}

function macro(t) {
  const m = $('#macro'), eye = $('#eye');
  let i = -1; for (let j = 0; j < CLAPS.length; j++) if (t >= CLAPS[j]) i = j;

  const t0 = CLAPS[i], t1 = i + 1 < CLAPS.length ? CLAPS[i + 1] : STOMP;
  const e = E.outCubic(clamp((t - t0) / (t1 - t0), 0, 1));

  const z = Math.max(z0 * (1 + dz * e) * (1 + 0.25 * (1 - k(t, t0, t0 + 0.18, E.outExpo))), SH / 1080 * 1.02);

  const x = clamp(SW / 2 - (fx0 + dx * e) * W, SW - W, 0), y = clamp(SH / 2 - (fy0 + dy * e) * H, SH - H, 0);
  set(m, { backgroundImage: `url(${src})`, backgroundSize: `${W}px ${H}px`, backgroundPosition: `${x}px ${y}px`, opacity: 1,
    filter: `brightness(${1 + 0.5 * (1 - k(t, t0, t0 + 0.12))}) blur(${(1 - k(t, t0, t0 + 0.1)) * 6}px)` });
}

function question(t) {

  q1.style.top = `${960 - n1 * 112 - 30}px`;

function logo(t) {

  let p = 0, prev = 0;

function placeImg(img, src, zoom, fx, fy, ww, wh) {
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  const v = VIEWS[src] || W1;
  const s = v.s * zoom, nw = v.nw;
  // zoom toward a point given as a fraction of the window (fx, fy)
  const cx = v.cx + (fx - 0.5) * ww / v.s * (1 - 1 / zoom), cy = v.cy + (fy - 0.5) * wh / v.s * (1 - 1 / zoom);
  set(img, { width: `${nw * s}px`, left: `${ww / 2 - cx * s}px`, top: `${wh / 2 - cy * s}px` });
}

function demo(t) {

  let a = 0; for (let j = 0; j < SEQ.length; j++) if (t >= SEQ[j][0]) a = j;

  const zoomFinal = k(t, 12.48, 12.75, E.outExpo);
  const zoom = 1 + 0.18 * zoomSubj + 0.16 * zoomFinal;
  placeImg(i1, cur[1], zoom, 0.5, 0.42, ww, wh);

  set(win, { width: ww + 'px', height: wh + 'px', left: '60px', top: '170px',
    transform: `perspective(2200px) translateY(${(1 - fin) * 700}px) rotateX(${(1 - fin) * 18}deg) rotateY(${(1 - fin) * -10}deg) scale(${mix(0.85, 1, fin) * (1 + p) * (1 + 0.5 * out)})`,
    opacity: (1 - out) * clamp((t - 9.4) / 0.08, 0, 1) });
  const chip = $('#chip');

  if (t >= 10.105) { pop(chip, t, 10.105, 1.8); set(chip, { left: '50%', top: '1340px', marginLeft: '-250px' }); }
  $('#cap1').style.display = t >= 10.8 && t < 11.285 ? 'block' : 'none';
  $('#cap2').style.display = t >= 11.285 && t < 13.18 ? 'block' : 'none';
  wordsIn('#cap1', t, [10.8, 10.9, 11.0, 11.03], 1.6);
  wordsIn('#cap2', t, [11.285, 11.515], 1.6);
  $('#cap2').style.opacity = 1 - out;
  const cu = $('#cursor');
  if (t >= 9.7 && t < 10.5) {
    const m = k(t, 9.7, 10.05, E.inOutCubic);
    set(cu, { display: 'block', left: `${mix(820, 560, m)}px`, top: `${mix(1240, 560, m)}px`, transform: `scale(${t > 10.05 && t < 10.2 ? 0.85 : 1})` });
  } else cu.style.display = 'none';
}

function beforeAfter(t) {

  const r = $('#baR'); if (t < 13.745) r.style.opacity = 0; else pop(r, t, 13.745, 1.5);
}

function menus(t) {
  const T = [14.095, 14.33, 14.685];
  const pos = [[630, 190, 7], [285, 220, 0], [-5, 190, -7]];
  for (let i = 0; i < 3; i++) {

  }

}

function need(t) {
  wordsIn('#need', t, [15.42, 15.62, 15.86, 16.095], 1.6);
  let a = -1; for (let j = 0; j < ITEMS.length; j++) if (t >= ITEMS[j][0]) a = j;
  const it = $('#item'), ib = $('#itemBg');
  if (a < 0) { it.style.opacity = 0; ib.style.opacity = 0; return; }
  const [t0, txt, lat, img] = ITEMS[a];
  if (it.dataset.i !== String(a)) {

  ib.style.opacity = img ? 0.9 * k(t, t0, t0 + 0.15) * (1 - k(t, 19.85, 19.99)) : 0;

}

  pl.forEach((p, i) => { if (t < T[i]) p.style.opacity = 0; else pop(p, t, T[i], 1.5); });
}

function endCard(t) {
  const L = $('#endLogo'), x = k(t, 22.565, 22.85, E.outExpo);
  L.style.transform = `scale(${mix(1.35, 1, x)})`; L.style.filter = `blur(${(1 - x) * 14}px)`; L.style.opacity = x;
  const b = $('#endBtn .btn');
  if (t < 22.915) b.style.opacity = 0;
  else { pop(b, t, 22.915, 1.5); const press = t >= 23.27 ? 1 - 0.08 * Math.exp(-(t - 23.27) * 14) : 1; b.style.transform += ` scale(${press})`; }
  b.style.boxShadow = t >= 23.495 ? `0 0 0 ${44 * k(t, 23.495, 24.0)}px rgba(214,60,50,${0.5 * (1 - k(t, 23.495, 24.0))})` : 'none';
  const u = $('#endUrl'); if (t < 23.27) u.style.opacity = 0; else { u.style.opacity = k(t, 23.27, 23.5); u.style.transform = `translateY(${(1 - k(t, 23.27, 23.6, E.outExpo)) * 30}px)`; }
  const cu = $('#cursor');
  if (t >= 22.95) {

    set(cu, { display: 'block', left: `${mix(900, 640, m)}px`, top: `${mix(1560, 1210, m)}px`, transform: `scale(${t > 23.27 && t < 23.4 ? 0.85 : 1})` });
  }
}

function render(t) {
  t = t + 0.02; // visuals land a hair before the sound, which reads as on the beat
  bg(t, t < STOMP ? 0 : t < DROP ? 0.15 : 1);
  if (show('L_macro', t < STOMP)) macro(t);
  if (show('L_q', t >= STOMP && t < 6.95)) question(t);
  if (show('L_logo', t >= 6.85 && t < 9.4)) logo(t);
  const inDemo = show('L_demo', t >= 9.4 && t < 13.18);
  if (inDemo) demo(t); else if (t < 22.95) $('#cursor').style.display = 'none';
  if (show('L_ba', t >= 13.18 && t < 14.095)) beforeAfter(t);
  if (show('L_menus', t >= 14.095 && t < 15.42)) menus(t);
  if (show('L_need', t >= 15.42 && t < 19.99)) need(t);
  if (show('L_free', t >= 19.99 && t < 20.68)) free(t);
  if (show('L_claim', t >= 20.68 && t < 22.565)) claim(t);
  if (show('L_end', t >= 22.565)) endCard(t);
  $('#flash').style.opacity = flashAt(t, [DROP, 9.4, 13.18, 19.99, 22.565], 0.18, 0.55) + flashAt(t, CLAPS, 0.06, 0.12);
  $('#stage').style.opacity = 1 - k(t, 24.25, 24.84, E.inCubic);
}
const PRE = [...SEQ.map(s => s[1]), ...MACROS.map(m => m[0]), ...ITEMS.filter(i => i[3]).map(i => i[3])];
window.__keep = PRE.map(src => { const im = new Image(); im.src = src; return im; });
document.fonts.ready.then(() => Promise.all([...document.images, ...window.__keep].map(i => i.decode().catch(() => 0)))).then(() => { render(0); window.READY = true; });
