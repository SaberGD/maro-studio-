    steps: [[34.035, 'cap2/u3.png'], [34.535, 'cap2/c2.png']], fx: 1000, fy: 620, keys: [['Ctrl', 'V'], 34.535] },
  { t0: 35.375, t1: 36.805, n: '13', cap: 'والشاشة كلها ليك', sub: '',
    steps: [[35.375, 'cap2/k4.png'], [36.08, 'cap2/tab1.png']], fx: 960, fy: 540, keys: [['Tab'], 36.08] },
  { t0: 36.805, t1: STOP, n: '14', cap: 'قبل… وبعد', sub: '',
    steps: [[36.805, 'fix/11-open.png'], [37.295, 'fix/18-final.png', 0.2], [37.89, 'cap3/bm1.png'], [38.385, 'cap3/bl5.png']], fx: 813, fy: 586 },
];

const show = (id, on) => { document.getElementById(id).style.display = on ? 'block' : 'none'; return on; };
const flashAt = (t, times, dur, amt) => { let v = 0; for (const x of times) if (t >= x && t < x + dur) v = Math.max(v, amt * (1 - (t - x) / dur)); return v; };
const punch = (t, t0, amt) => (t < t0 ? 0 : amt * Math.exp(-(t - t0) * 9) * Math.cos((t - t0) * 18));
const pop = (el, t, t0, from) => { const x = k(t, t0, t0 + 0.2, E.outBack); el.style.opacity = clamp((t - t0) / 0.05, 0, 1); el.style.transform = `scale(${mix(from || 1.6, 1, x)})`; el.style.filter = `blur(${(1 - k(t, t0, t0 + 0.14)) * 12}px)`; };
const wordsIn = (sel, t, times, from) => $$(sel + ' .word').forEach((w, i) => { if (t < times[i]) { w.style.display = 'none'; return; } w.style.display = 'inline-block'; pop(w, t, times[i], from); });

function bg(t, amt) {
  set('#b1', { width: '1100px', height: '900px', left: `${-200 + 220 * Math.sin(t * 0.3)}px`, top: `${200 + 120 * Math.cos(t * 0.35)}px`, background: 'rgba(255,255,255,.10)', opacity: 0.55 * amt });
  set('#b2', { width: '1200px', height: '900px', left: `${1100 + 200 * Math.cos(t * 0.27)}px`, top: `${450 + 150 * Math.sin(t * 0.3)}px`, background: 'rgba(120,120,128,.18)', opacity: 0.7 * amt });
  set('#b3', { width: '420px', height: '420px', left: `${1300 + 160 * Math.sin(t * 0.45)}px`, top: `${120 + 60 * Math.sin(t * 0.6)}px`, background: 'rgba(229,57,36,.22)', opacity: 0.25 * amt });
  const m = $('#bgMark'); m.style.opacity = 0.045 * amt; m.style.transform = `translate(${-30 * Math.sin(t * 0.1)}px, ${20 * Math.cos(t * 0.12)}px) rotate(${-4 + 2 * Math.sin(t * 0.08)}deg)`;
}

function macro(t) {
  const m = $('#macro');
  let i = -1; for (let j = 0; j < INTRO.length; j++) if (t >= INTRO[j]) i = j;
  if (i < 0) { m.style.opacity = 0; return; }
  const [src, fx, fy, z0] = MACROS[i];
  const t0 = INTRO[i], t1 = i + 1 < INTRO.length ? INTRO[i + 1] : BUILD[0];
  const e = E.outCubic(clamp((t - t0) / (t1 - t0), 0, 1));
  const z = z0 * (1 + 0.08 * e) * (1 + 0.25 * (1 - k(t, t0, t0 + 0.16, E.outExpo)));
  const Wd = 1920 * z, Hd = 1080 * z;
  const x = clamp(960 - fx * Wd, 1920 - Wd, 0), y = clamp(540 - fy * Hd, 1080 - Hd, 0);
  set(m, { backgroundImage: `url(${src})`, backgroundSize: `${Wd}px ${Hd}px`, backgroundPosition: `${x}px ${y}px`, opacity: 1 - k(t, BUILD[0] - 0.1, BUILD[0]),
    filter: `brightness(${1 + 0.5 * (1 - k(t, t0, t0 + 0.1))}) blur(${(1 - k(t, t0, t0 + 0.08)) * 6}px)` });
}

function build(t) {
  wordsIn('#bw', t, BUILD, 1.7);
  const out = k(t, 5.9, 6.2, E.inCubic);
  $('#bw').style.transform = `scale(${1 - 0.9 * out})`; $('#bw').style.opacity = 1 - out;
}

function logo(t) {
  const STEPS = [[6.265, 0.12], [6.5, 0.46], [6.985, 0.76], [7.22, 1]];
  let p = 0, prev = 0;
  for (const [ts, v] of STEPS) { if (t < ts) break; p = mix(prev, v, k(t, ts, ts + 0.12, E.outCubic)); prev = v; }
  $('#hx_wipe').setAttribute('width', String(+$('#hxMark').dataset.vw * p + 2));
  $('#hxBar').style.width = (p * 100).toFixed(1) + '%';
  const st = $('#hxStatus');
  st.innerHTML = t < DROP ? (p < 1 ? `بنحمّل HORIX… <span dir="ltr">${Math.floor(p * 100)}%</span>` : 'بنجهّز الأدوات…') : 'جاهز';
  st.style.opacity = 1 - k(t, 8.6, 8.9); $('#hxTrack').style.opacity = 1 - k(t, 8.6, 8.9);
  $('#hxEye').style.transform = `scaleY(${mix(0.12, 1, k(t, DROP, DROP + 0.5, E.outBack))})`;
  $('#hxEye').style.opacity = mix(0.55, 1, k(t, DROP, DROP + 0.2));
  const L = $('#lockup'), inn = k(t, 6.1, 6.35, E.outCubic), up = k(t, 8.9, 9.3, E.inOutCubic);
  L.style.transform = `translateY(${-70 * up}px) scale(${mix(0.92, 1, inn) * (1 + 0.06 * k(t, DROP, DROP + 0.3, E.outExpo)) * mix(1, 0.9, up) * (1 + punch(t, 8.425, 0.03))})`;
  L.style.opacity = inn;
  wordsIn('#tag', t, [8.96, 9.27, 9.62], 1.5);
  $('#L_logo').style.opacity = 1 - k(t, 10.2, 10.355, E.inCubic);
}

function placeImg(img, src, s, fx, fy, ww, wh) {
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  const nw = src.startsWith('hd/') || src.startsWith('fix/hd') ? 3840 : 1920, q = nw === 3840 ? 0.5 : 1;
  const x = clamp(ww / 2 - fx * s, ww - 1920 * s, 0), y = clamp(wh / 2 - fy * s, wh - 1080 * s, 0);
  set(img, { width: `${nw * s * q}px`, left: `${x}px`, top: `${y}px` });
}

function keysOn(t, defs) {
  const el = $('#keys');
  if (!defs) { el.style.display = 'none'; return; }
  let combo = null, at = null;
  for (let j = 0; j < defs.length; j++) if (Array.isArray(defs[j])) for (let q = j + 1; q < defs.length && !Array.isArray(defs[q]); q++) if (t >= defs[q] - 0.15) { combo = defs[j]; at = defs[q]; }
  if (!combo) { el.style.display = 'none'; return; }
  const html = combo.map((c, i) => (i ? '<span class="plus">+</span>' : '') + `<span class="key${i === combo.length - 1 ? ' red' : ''}">${c}</span>`).join('');
  if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; }
  const x = k(t, at - 0.15, at, E.outBack), p = t >= at ? Math.exp(-(t - at) * 12) : 0;
  set(el, { display: 'flex', opacity: x, transform: `scale(${mix(0.6, 1, x)})` });
  el.querySelectorAll('.key').forEach((kk) => { kk.style.transform = `translateY(${9 * p}px)`; });
}

function feature(t) {
  let si = 0; for (let j = 0; j < F.length; j++) if (t >= F[j].t0) si = j;
  const sc = F[si];
  let a = 0; for (let j = 0; j < sc.steps.length; j++) if (t >= sc.steps[j][0]) a = j;
  const cur = sc.steps[a], prev = sc.steps[Math.max(0, a - 1)];
  const z = 0.573 * (1 + 0.14 * k(t, sc.t0, sc.t1, E.inOutCubic));
  placeImg($('#wimg1'), cur[1], z, sc.fx, sc.fy, W.ww, W.wh);
  placeImg($('#wimg0'), prev[1], z, sc.fx, sc.fy, W.ww, W.wh);
  $('#wimg1').style.opacity = cur[2] ? k(t, cur[0], cur[0] + cur[2], E.inOutCubic) : 1;
  const fin = k(t, sc.t0, sc.t0 + 0.25, E.outExpo);
  const hits = sc.steps.slice(1).reduce((acc, s) => acc + punch(t, s[0], 0.02), 0);
  const firstIn = k(t, 10.355, 10.7, E.outExpo);
  set($('#win'), { width: W.ww + 'px', height: W.wh + 'px', left: W.x + 'px', top: W.y + 'px',
    transform: `perspective(2400px) rotateY(${(1 - firstIn) * 16}deg) translateX(${(1 - fin) * -60}px) scale(${mix(0.94, 1, fin) * (1 + hits) * mix(0.85, 1, firstIn)})`,
    opacity: firstIn * (1 - k(t, STOP - 0.1, STOP)) });
  const cap = $('#fcap'), sub = $('#fsub'), num = $('#fnum');
  if (cap.dataset.s !== String(si)) { cap.dataset.s = si; cap.textContent = sc.cap; sub.textContent = sc.sub; num.textContent = sc.n; cap.className = 'cap' + (sc.lat ? ' lat' : ''); }
  if (cap.dataset.fit !== String(si)) { cap.dataset.fit = si; let fs = sc.lat ? 104 : 92; cap.style.fontSize = fs + 'px'; cap.style.transform = 'none';
    while (cap.scrollWidth > 680 && fs > 40) { fs -= 4; cap.style.fontSize = fs + 'px'; }
    sub.style.top = (380 + fs * 1.15 + 24) + 'px'; }
  pop(cap, t, sc.t0 + 0.03, 1.35); pop(num, t, sc.t0, 1.6);
  sub.style.opacity = k(t, sc.t0 + 0.2, sc.t0 + 0.4); sub.style.transform = `translateY(${(1 - k(t, sc.t0 + 0.2, sc.t0 + 0.5, E.outExpo)) * 20}px)`;
  keysOn(t, sc.keys);
  const fade = 1 - k(t, STOP - 0.1, STOP);
  cap.style.opacity = Math.min(+cap.style.opacity, fade); sub.style.opacity = Math.min(+sub.style.opacity, fade); num.style.opacity = Math.min(+num.style.opacity, fade);
}

function stopScene(t) {
  const s = $('#stopw'), x = k(t, STOP, STOP + 0.25, E.outExpo);
  s.style.transform = `scale(${mix(1.8, 1, x) * (1 + 0.06 * k(t, STOP + 0.25, RE, E.inOutCubic))})`; s.style.filter = `blur(${(1 - x) * 16}px)`; s.style.opacity = x;
  $('#stopRule').style.transform = `scaleX(${k(t, STOP + 0.15, STOP + 0.45, E.outExpo)})`;
}

function rebuild(t) {
  wordsIn('#re1', t, [RE, 40.89], 1.6);
  wordsIn('#re2', t, [41.38, 41.97, 42.57], 1.5);
  const out = k(t, 43.4, 43.71, E.inCubic);
  $('#L_re').style.opacity = 1 - out; $('#L_re').style.transform = `scale(${1 + 0.1 * out})`;
}

// platforms: web (browser capture), then the download page
const PSHOTS = [[DROP2, 'cap4/w03.png', 'افتحه من المتصفح'], [46.19, 'menus/downloads.png', 'أو حمّله على جهازك']];
function plat(t) {
  let a = 0; for (let j = 0; j < PSHOTS.length; j++) if (t >= PSHOTS[j][0]) a = j;
  const cur = PSHOTS[a], prev = PSHOTS[Math.max(0, a - 1)];
  const pw = 1160, ph = 652, z = 0.604 * (1 + 0.05 * k(t, cur[0], cur[0] + 2.4));
  placeImg($('#pimg1'), cur[1], z, 960, 540, pw, ph); placeImg($('#pimg0'), prev[1], z, 960, 540, pw, ph);
  $('#pimg1').style.opacity = k(t, cur[0], cur[0] + 0.2);
  const fin = k(t, DROP2, DROP2 + 0.3, E.outExpo);
  set($('#pwin'), { width: pw + 'px', height: ph + 'px', left: `${(1920 - pw) / 2}px`, top: '180px', transform: `scale(${mix(1.2, 1, fin) * (1 + punch(t, 46.19, 0.025))})`, opacity: fin });
  const tt = $('#ptitle'); if (tt.dataset.a !== String(a)) { tt.dataset.a = a; tt.textContent = cur[2]; } pop(tt, t, cur[0] + 0.05, 1.4);
  const chips = $$('#chips .chip'), T = [44.795, 45.455, 46.67];
  chips.forEach((c, i) => { if (t < T[i]) c.style.opacity = 0; else pop(c, t, T[i], 1.5); });
  $('#L_plat').style.opacity = 1 - k(t, 48.9, 49.08);
}

const WORDS = ['Layers', 'Masks', 'PSD', 'Camera Raw', 'Liquify', 'Blur', 'Blend Modes', 'Curves', 'Select Subject'];
const WT = [49.08, 49.67, 50.04, 50.515, 50.875, 51.23, 51.64, 51.96, 52.2];
function grid(t) {
  const g = $('#grid');
  if (!g.children.length) g.innerHTML = WORDS.map((w, i) => `<div class="${i % 2 ? 'red' : ''}">${w}</div>`).join('');
  [...g.children].forEach((d, i) => { if (t < WT[i]) d.style.opacity = 0; else pop(d, t, WT[i], 1.6); });
  pop($('#gtitle'), t, 49.08, 1.3);
  $('#L_grid').style.opacity = 1 - k(t, END - 0.15, END);
}

function endCard(t) {
  const L = $('#endLogo'), x = k(t, END, END + 0.3, E.outExpo);
  L.style.transform = `scale(${mix(1.3, 1, x) * (1 + punch(t, 55.08, 0.02))})`; L.style.filter = `blur(${(1 - x) * 12}px)`; L.style.opacity = x;
  const b = $('#endBtn .btn');
  if (t < 53.155) b.style.opacity = 0; else { pop(b, t, 53.155, 1.5); const pr = t >= 57.37 ? 1 - 0.08 * Math.exp(-(t - 57.37) * 14) : 1; b.style.transform += ` scale(${pr})`; }
  b.style.boxShadow = t >= LAST ? `0 0 0 ${48 * k(t, LAST, LAST + 0.6)}px rgba(214,60,50,${0.5 * (1 - k(t, LAST, LAST + 0.6))})` : 'none';
  const u = $('#endUrl'); if (t < 54.37) u.style.opacity = 0; else { u.style.opacity = k(t, 54.37, 54.6); u.style.transform = `translateY(${(1 - k(t, 54.37, 54.7, E.outExpo)) * 30}px)`; }
  const cu = $('#cursor');
  if (t >= 56.3) { const m = k(t, 56.3, 57.3, E.inOutCubic); set(cu, { display: 'block', left: `${mix(1500, 1010, m)}px`, top: `${mix(1000, 760, m)}px`, transform: `scale(${t > 57.37 && t < 57.5 ? 0.85 : 1})` }); }
  else cu.style.display = 'none';
}

function render(t) {
  t = t + 0.02;
  bg(t, t < BUILD[0] ? 0 : t < DROP ? 0.3 : (t >= STOP && t < RE ? 0.4 : 1));
  if (show('L_macro', t < BUILD[0])) macro(t);
  if (show('L_build', t >= BUILD[0] && t < 6.25)) build(t);
  if (show('L_logo', t >= 6.1 && t < 10.355)) logo(t);
  if (show('L_feat', t >= 10.355 && t < STOP)) feature(t); else $('#keys').style.display = 'none';
  if (show('L_stop', t >= STOP && t < RE)) stopScene(t);
  if (show('L_re', t >= RE && t < DROP2)) rebuild(t);
  if (show('L_plat', t >= DROP2 && t < 49.08)) plat(t);
  if (show('L_grid', t >= 49.08 && t < END)) grid(t);
  if (show('L_end', t >= END)) endCard(t);
  const cuts = [DROP, 10.355, PEAK, STOP, DROP2, 46.19, 49.08, END, ...F.map((s) => s.t0)];
  $('#flash').style.opacity = flashAt(t, [DROP, PEAK, DROP2, END], 0.18, 0.5) + flashAt(t, INTRO, 0.06, 0.12) + flashAt(t, cuts, 0.07, 0.12);
  $('#stage').style.opacity = 1 - k(t, 59.6, 60.25, E.inCubic);
}
const PRE = [...new Set([...F.flatMap((s) => s.steps.map((x) => x[1])), ...MACROS.map((m) => m[0]), ...PSHOTS.map((p) => p[1])])];
window.__keep = PRE.map((src) => { const im = new Image(); im.src = src; return im; });
document.fonts.ready.then(() => Promise.all([...document.images, ...window.__keep].map((i) => i.decode().catch(() => 0)))).then(() => { render(0); window.READY = true; });
</script>
