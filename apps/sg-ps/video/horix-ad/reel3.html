<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Cairo; font-weight: 700; src: url(a/cairo-arabic-700-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 800; src: url(a/cairo-arabic-800-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 900; src: url(a/cairo-arabic-900-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 700; src: url(a/cairo-latin-700-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: Cairo; font-weight: 900; src: url(a/cairo-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
@font-face { font-family: Barlow; font-weight: 700; src: url(a/barlow-condensed-latin-700-normal.woff2); }
@font-face { font-family: Barlow; font-weight: 800; src: url(a/barlow-condensed-latin-800-normal.woff2); }
@font-face { font-family: Inter; font-weight: 600; src: url(a/inter-latin-600-normal.woff2); }
:root { --ink: #141314; --amber: #EA993F; --red: #D63C32; --ivory: #F3EFE8; --graphite: #2A2727; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); color: var(--ivory); font-family: Cairo, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; direction: ltr; }
.layer { position: absolute; inset: 0; display: none; }
.lat { font-family: Barlow, sans-serif; font-weight: 800; direction: ltr; }
.ar { direction: rtl; font-weight: 900; }
.red { color: var(--red); }
#glow { position: absolute; inset: -20%; }
.blob { position: absolute; border-radius: 50%; filter: blur(130px); }
#grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#macro { position: absolute; inset: 0; background-repeat: no-repeat; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.word { display: inline-block; white-space: nowrap; }
.line { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; white-space: nowrap; }
.stack { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; }
.stack .word { display: block; }
.win { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 50px 140px rgba(0,0,0,.7), 0 0 0 1px rgba(243,239,232,.10); background: #0d0c0d; }
.win img { position: absolute; max-width: none; }
/* keyboard keys */
.keys { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; direction: ltr; }
.key { position: relative; min-width: 150px; height: 150px; padding: 0 34px; border-radius: 26px; background: linear-gradient(#3a3636, #2A2727); color: var(--ivory);
  font: 800 70px/150px Barlow, sans-serif; text-align: center; box-shadow: 0 14px 0 #171515, 0 26px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08); }
.key.red { background: linear-gradient(#e0473d, #b9322a); box-shadow: 0 14px 0 #7d211b, 0 26px 50px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.18); color: var(--ivory); }
.plus { font: 800 70px/150px Barlow, sans-serif; color: rgba(243,239,232,.5); }
.cap { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; font-size: 104px; font-weight: 900; white-space: nowrap; }
.tool { position: absolute; width: 64px; height: 64px; display: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.7)); }
.ring { position: absolute; border-radius: 50%; border: 6px solid var(--amber); display: none; }
.plat { display: inline-block; padding: 18px 34px; border-radius: 999px; border: 2px solid rgba(243,239,232,.25); font-size: 50px; margin: 0 10px; }
.btn { display: inline-block; padding: 30px 80px; border-radius: 20px; background: var(--red); color: var(--ivory); font-size: 76px; font-weight: 900; }
.hx-dim path, .hx-dim polygon, .hx-dim rect { fill: rgba(243,239,232,.08); }
.hx-dim .x { fill: rgba(214,60,50,.12); }
.hx-lit path, .hx-lit polygon, .hx-lit rect { fill: #F3EFE8; }
.hx-lit .x { fill: #D63C32; }
.hx-eye { fill: #EA993F; transform-box: fill-box; transform-origin: 50% 40%; }
#hxDesc { position:absolute; left:0; right:0; top:1110px; text-align:center; font: 600 38px/1 Inter, sans-serif; letter-spacing: .18em; direction: ltr; }
#hxTrack { position:absolute; left:50%; top:1180px; width:640px; margin-left:-320px; height:6px; background: rgba(243,239,232,.1); overflow:hidden; }
#hxBar { position:absolute; left:0; top:0; bottom:0; width:0; background: var(--red); }
#hxStatus { position:absolute; left:0; right:0; top:1220px; text-align:center; font-size:50px; font-weight:700; color:#C4BDB4; direction: rtl; }
</style>

<script>

const SW = 1080, SH = 1920;
// Beat map of the Stomp Clap track (128 BPM): claps, stomps, break, drop at 7.595, bars every ~1.88 s.
const CLAPS = [0.365, 0.835, 1.19, 1.54, 1.89, 2.245, 2.73, 3.065, 3.415];
const STOMP = 3.77, DROP = 7.595;

// Macro details: [image, focusX, focusY, zoom, driftX, driftY, zoomDrift]

  ['cap3/cr4.png', 0.92, 0.30, 2.4, 0, 0.04, 0.08],

const WIN_WIDE = { ww: 1000, wh: 650, x: 40, y: 560 };
// card: a floating crop of the app's own panel [x, y, w, h] in screenshot px, shown at stage (sx, sy) with scale cs
const SCENES = [
  { t0: 9.4, t1: 11.285, win: WIN_TALL, cx: 795, cy: 531, s: 1.12, keys: null, cap: 'Camera Raw', latCap: true, sub: 'لوّن صورك زي المحترفين',

  { t0: 18.805, t1: 19.99, win: WIN_TALL, cx: 813, cy: 586, s: 1.2, keys: null, cap: 'كل ده… في HORIX', sub: '',

const show = (id, on) => { document.getElementById(id).style.display = on ? 'block' : 'none'; return on; };
const flashAt = (t, times, dur, amt) => { let v = 0; for (const x of times) if (t >= x && t < x + dur) v = Math.max(v, amt * (1 - (t - x) / dur)); return v; };
const punch = (t, t0, amt) => (t < t0 ? 0 : amt * Math.exp(-(t - t0) * 9) * Math.cos((t - t0) * 18));
const pop = (el, t, t0, from) => { const x = k(t, t0, t0 + 0.22, E.outBack); el.style.opacity = clamp((t - t0) / 0.06, 0, 1); el.style.transform = `scale(${mix(from || 1.6, 1, x)})`; el.style.filter = `blur(${(1 - k(t, t0, t0 + 0.16)) * 14}px)`; };
const wordsIn = (sel, t, times, from) => $$(sel + ' .word').forEach((w, i) => {

}

function macro(t) {

function placeImg(img, src, sc) {

const toStage = (sc, x, y) => [sc.win.x + sc.win.ww / 2 + (x - sc.cx) * sc.s * sc.zoom, sc.win.y + sc.win.wh / 2 + (y - sc.cy) * sc.s * sc.zoom];

function keyRow(defs) {

function feature(t) {

    }
    if (combo) {
      const defs = []; combo.forEach((kk, q) => { if (q) defs.push('+'); defs.push({ k: kk, red: q === combo.length - 1 }); });
      const html = keyRow(defs); if (fk.dataset.h !== html) { fk.innerHTML = html; fk.dataset.h = html; }

    } else fk.style.display = 'none';

  // caption
  const cap = $('#fcap'), sub = $('#fsub');
  if (cap.dataset.s !== String(si)) { cap.dataset.s = si; cap.textContent = sc.cap; sub.textContent = sc.sub; cap.className = 'cap' + (sc.latCap ? ' lat' : ''); }
  const capTop = sc.win === WIN_WIDE ? 1290 : 1440;
  cap.style.top = capTop + 'px'; sub.style.top = (capTop + 140) + 'px';
  pop(cap, t, sc.t0 + 0.05, 1.4);
  if (sc.sub) { sub.style.display = 'block'; sub.style.opacity = k(t, sc.t0 + 0.25, sc.t0 + 0.45); } else sub.style.display = 'none';
  if (si === SCENES.length - 1) cap.style.opacity = Math.min(+cap.style.opacity, 1 - k(t, 19.85, 19.99));

  const card = $('#card'), c0 = $('#cimg0'), c1 = $('#cimg1');
  if (sc.card && t >= (sc.cardFrom || sc.t0) && t < (sc.cardTo || sc.t1)) {
    const [rx, ry, rw, rh, sx, sy, cs] = sc.card;
    const put = (img, src) => { if (img.getAttribute('src') !== src) img.setAttribute('src', src); set(img, { width: `${1920 * cs}px`, left: `${-rx * cs}px`, top: `${-ry * cs}px` }); };
    put(c1, cur[1]); put(c0, prev[1]); c1.style.opacity = i1.style.opacity;
    const cin = k(t, (sc.cardFrom || sc.t0) + 0.1, (sc.cardFrom || sc.t0) + 0.4, E.outBack);
    set(card, { display: 'block', left: `${sx}px`, top: `${sy}px`, width: `${rw * cs}px`, height: `${rh * cs}px`, opacity: clamp(cin * 2, 0, 1), transform: `translateX(${(1 - cin) * 120}px) scale(${mix(0.85, 1, cin)})` });

    set(ring, { display: 'block', left: `${sx - r}px`, top: `${sy - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: 1 - 0.5 * k(t, rt + 0.6, rt + 1.2) });
  } else ring.style.display = 'none';
  // eyedropper: moves to the hair, samples on the hit

  if (sc.dropper && t >= sc.dropper[0] && t < sc.dropper[1]) {

    set(dr, { display: 'block', left: `${mix(ex + 260, ex, m) - 4}px`, top: `${mix(ey + 300, ey, m) - 60}px`, transform: `scale(${t > 14.095 && t < 14.2 ? 0.85 : 1})` });
  } else dr.style.display = 'none';
  // cursor: Alt+click on the layer row
  const cu = $('#cursor');
  if (sc.click && t >= sc.click[0] && t < sc.t1 - 0.3) {
    const [c0, c1, cx, cy] = sc.click; const [ex, ey] = toStage(sc, cx, cy); const m = k(t, c0, c1 - 0.05, E.inOutCubic);
    set(cu, { display: 'block', left: `${mix(ex - 200, ex, m)}px`, top: `${mix(ey + 260, ey, m)}px`, transform: `scale(${t > c1 && t < c1 + 0.12 ? 0.85 : 1})` });

  else cu.style.display = 'none';
}

function render(t) {
  t = t + 0.02; // visuals land a hair before the sound, which reads as on the beat
  bg(t, t < STOMP ? 0 : t < DROP ? 0.15 : 1);
  if (show('L_macro', t < STOMP)) macro(t);
  if (show('L_keys', t >= STOMP && t < 6.95)) keysScene(t);
  if (show('L_logo', t >= 6.85 && t < 9.4)) logo(t);
