<style>
@font-face { font-family: Cairo; font-weight: 700; src: url(a/cairo-arabic-700-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 800; src: url(a/cairo-arabic-800-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }
@font-face { font-family: Cairo; font-weight: 900; src: url(a/cairo-arabic-900-normal.woff2); unicode-range: U+0600-06FF, U+FE70-FEFF; }

:root { --ink: #0b0b0c; --amber: #FF9F1C; --red: #E53924; --ivory: #F4F0EB; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: var(--ivory); font-family: Cairo, sans-serif; }

<script>
window.DURATION = 25.70;
// Dynamic track, parts 2 and 3 only, joined on the beat (part 3's first hit 25 beats of 0.36 s after part 2's).
// Each part is built from 3.84 s phrases; every phrase ends in a triple stab at +1.625 / +1.985 / +2.345.
const O2 = 0.116, O3 = 9.116, PH = 3.84;
const STAB = (o) => [o + 1.625, o + 1.985, o + 2.345];
const S1 = STAB(O2), S2 = STAB(O2 + PH);
const DECAY = 7.8, END = O3 + 3 * PH + 1.985; // 22.621

const MACROS = [ // [image, natural w, h, fx, fy, zoom]
  ['a/pins-a.jpg', 1920, 1080, 0.42, 0.45, 2.4], ['a/qs-after-a.jpg', 592, 888, 0.5, 0.35, 1.9], ['a/ws-after-a.jpg', 1920, 1080, 0.88, 0.3, 2.6],
  ['a/subj-after-a.jpg', 554, 888, 0.5, 0.4, 1.8], ['a/mag-live.jpg', 554, 888, 0.45, 0.45, 2.2], ['a/of-hover2.jpg', 554, 888, 0.5, 0.45, 1.6],
];
const MT = [O2, 0.356, 0.596, 0.836, 1.076, 1.316];

const F = [
  { n: '01', cap: 'Select Subject', sub: 'ضغطة واحدة', b: 'subj-before-a', a: 'subj-after-a', from: 41.6, to: 93, note: 'دقة أعلى من الضعف' },
  { n: '02', cap: 'Quick Selection', sub: 'ضربة فرشاة واحدة', b: 'qs-before-a', a: 'qs-after-a', from: 44.7, to: 72.7, note: 'على 79 صورة حقيقية' },
  { n: '03', cap: 'Object Finder', sub: 'عدّي على العنصر… يتحدد', b: 'obj-before-a', a: 'obj-after-a', from: 63, to: 80, note: 'بالذكاء الاصطناعي' },
  { n: '04', cap: 'Magnetic Lasso', sub: 'بيلزق في الحافة', b: 'mag-live', a: 'mag-done', big: 'زي فوتوشوب', note: 'نفس شكل وقوة الأداة الأصلية' },
  { n: '05', cap: 'Refine Hair', sub: 'حواف الشعر بضغطة', b: 'rb-pre', a: 'rb-post', big: '−36%', note: 'غلط أقل في الحواف' },
  { n: '06', cap: 'Blur Gallery', sub: 'تحكّم على الصورة نفسها', b: 'pins-a', a: 'ring-a', full: true, big: 'كذا دبوس', note: 'Field · Iris · Tilt-Shift · Path' },
  { n: '07', cap: 'HORIX Web', sub: 'نفس الدقة على المتصفح', b: 'wsubj', a: 'wsubj', single: true, from: 74.8, to: 93, note: 'من غير تنزيل' },
];
const FT = [O3, O3 + 1.985, O3 + PH, O3 + PH + 1.985, O3 + 2 * PH, O3 + 2 * PH + 1.985, O3 + 3 * PH, END];
F.forEach((f, i) => { f.t0 = FT[i]; f.t1 = FT[i + 1]; });

const show = (id, on) => { document.getElementById(id).style.display = on ? 'block' : 'none'; return on; };
const flashAt = (t, times, dur, amt) => { let v = 0; for (const x of times) if (t >= x && t < x + dur) v = Math.max(v, amt * (1 - (t - x) / dur)); return v; };
const punch = (t, t0, amt) => (t < t0 ? 0 : amt * Math.exp(-(t - t0) * 9) * Math.cos((t - t0) * 18));
const pop = (el, t, t0, from) => { const x = k(t, t0, t0 + 0.2, E.outBack); el.style.opacity = clamp((t - t0) / 0.05, 0, 1); el.style.transform = `scale(${mix(from || 1.6, 1, x)})`; el.style.filter = `blur(${(1 - k(t, t0, t0 + 0.14)) * 12}px)`; };
const wordsIn = (sel, t, times, from) => $$(sel + ' .word').forEach((w, i) => { if (t < times[i]) { w.style.display = 'none'; return; } w.style.display = 'inline-block'; pop(w, t, times[i], from); });

function bg(t, amt) {
  set('#b1', { width: '1100px', height: '900px', left: `${-200 + 220 * Math.sin(t * 0.3)}px`, top: `${200 + 120 * Math.cos(t * 0.35)}px`, background: 'rgba(255,255,255,.10)', opacity: 0.55 * amt });
  set('#b2', { width: '1200px', height: '900px', left: `${1100 + 200 * Math.cos(t * 0.27)}px`, top: `${450 + 150 * Math.sin(t * 0.3)}px`, background: 'rgba(120,120,128,.18)', opacity: 0.7 * amt });
  set('#b3', { width: '420px', height: '420px', left: `${1300 + 160 * Math.sin(t * 0.45)}px`, top: `${120 + 60 * Math.sin(t * 0.6)}px`, background: 'rgba(229,57,36,.22)', opacity: 0.25 * amt });
  const m = $('#bgMark'); m.style.opacity = 0.045 * amt; m.style.transform = `translate(${-30 * Math.sin(t * 0.1)}px, ${20 * Math.cos(t * 0.12)}px) rotate(${-4 + 2 * Math.sin(t * 0.08)}deg)`;
}

function macro(t) {
  const m = $('#macro');
  let i = -1; for (let j = 0; j < MT.length; j++) if (t >= MT[j]) i = j;
  if (i < 0) { m.style.opacity = 0; return; }
  const [src, nw, nh, fx, fy, z0] = MACROS[i];
  const t0 = MT[i], t1 = i + 1 < MT.length ? MT[i + 1] : S1[0];
  const e = E.outCubic(clamp((t - t0) / (t1 - t0), 0, 1));
  const cover = Math.max(1920 / nw, 1080 / nh);
  const z = cover * z0 * (1 + 0.08 * e) * (1 + 0.25 * (1 - k(t, t0, t0 + 0.16, E.outExpo)));
  const Wd = nw * z, Hd = nh * z;
  const x = clamp(960 - fx * Wd, 1920 - Wd, 0), y = clamp(540 - fy * Hd, 1080 - Hd, 0);
  set(m, { backgroundImage: `url(${src})`, backgroundSize: `${Wd}px ${Hd}px`, backgroundPosition: `${x}px ${y}px`, opacity: 1 - k(t, S1[0] - 0.08, S1[0]),
    filter: `brightness(${1 + 0.5 * (1 - k(t, t0, t0 + 0.1))}) blur(${(1 - k(t, t0, t0 + 0.08)) * 6}px)` });
}

function build(t) {

}

function logo(t) {
  const o = O2 + PH;

  L.style.transform = `translateY(${-60 * up}px) scale(${mix(0.9, 1, inn) * (1 + 0.06 * k(t, S2[0], S2[0] + 0.3, E.outExpo)) * mix(1, 0.88, up) * (1 + punch(t, S2[1], 0.03) + punch(t, S2[2], 0.03))})`;
  L.style.opacity = inn;
  wordsIn('#tag', t, [S2[0] + 0.12, S2[0] + 0.12, S2[1], S2[1], S2[2], S2[2]], 1.6);

function stopScene(t) {
  pop($('#st1'), t, DECAY, 1.5);
  const s = $('#st2'), x = k(t, DECAY + 0.36, DECAY + 0.6, E.outExpo);

  $('#L_stop').style.opacity = 1 - k(t, O3 - 0.06, O3);

const WW = 1100, WH = 700, WX = 60, WY = 190;
function fit(img, f, src) {
  if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  const nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
  const s = f.full ? Math.max(WW / nw, WH / nh) : Math.min(WW / nw, WH / nh);
  set(img, { width: nw * s + 'px', height: nh * s + 'px', left: (WW - nw * s) / 2 + 'px', top: (WH - nh * s) / 2 + 'px' });
}

function feature(t) {
  let si = 0; for (let j = 0; j < F.length; j++) if (t >= F[j].t0) si = j;
  const f = F[si], d = f.t1 - f.t0, r = t - f.t0;
  const W = $('#win');
  if (W.dataset.s !== String(si)) {
    W.dataset.s = si;
    $('#wbk').style.backgroundImage = `url(a/${f.a}.jpg)`;
    $('#fnum').textContent = f.n; $('#fcap').textContent = f.cap; $('#fsub').textContent = f.sub; $('#fnote').textContent = f.note;
    const st = $('#fstat');
    st.querySelector('.from').textContent = f.from != null ? f.from + '%' : '';
    st.querySelector('.arr').style.display = f.from != null ? '' : 'none';
    let fs = 112; $('#fcap').style.fontSize = fs + 'px';

  }
  fit($('#wb'), f, `a/${f.b}.jpg`); fit($('#wa'), f, `a/${f.a}.jpg`);
  // before -> after wipe, right to left, landing on the beat at +0.96

  const p = f.single ? 1 : k(t, f.t0 + w0, f.t0 + w1, E.inOutCubic);
  $('#wa').style.clipPath = `inset(0 0 0 ${((1 - p) * 100).toFixed(2)}%)`;
  set('#wline', { left: ((1 - p) * 100).toFixed(2) + '%', opacity: p > 0 && p < 1 ? 1 : 0 });
  $('#tb').style.opacity = f.single ? 0 : 1 - k(t, f.t0 + w0, f.t0 + w0 + 0.2);
  $('#ta').style.opacity = f.single ? 0 : k(t, f.t0 + w1 - 0.1, f.t0 + w1 + 0.05);
  const fin = k(t, f.t0, f.t0 + 0.25, E.outExpo), firstIn = k(t, O3, O3 + 0.35, E.outExpo);
  const z = 1 + 0.06 * (r / d) + punch(t, f.t0 + w1, 0.02) + (si % 2 === 0 ? punch(t, f.t0 + 1.625, 0.02) : 0);
  set(W, { width: WW + 'px', height: WH + 'px', left: WX + 'px', top: WY + 'px',
    transform: `perspective(2400px) rotateY(${(1 - firstIn) * 16}deg) translateX(${(1 - fin) * -80}px) scale(${mix(0.92, 1, fin) * z * mix(0.85, 1, firstIn)})`,
    opacity: firstIn * (1 - k(t, END - 0.08, END)) });
  pop($('#fnum'), t, f.t0, 1.6); pop($('#fcap'), t, f.t0 + 0.03, 1.35);
  const sb = $('#fsub'); sb.style.opacity = k(t, f.t0 + 0.15, f.t0 + 0.3); sb.style.transform = `translateY(${(1 - k(t, f.t0 + 0.15, f.t0 + 0.45, E.outExpo)) * 20}px)`;
  const st = $('#fstat'), to = st.querySelector('.to'), at = f.t0 + w1;
  if (f.from != null) {
    to.className = 'to';
    const c = k(t, f.t0 + 0.3, at + 0.2, E.outCubic);
    to.textContent = (Number.isInteger(f.to) && c >= 1 ? f.to : mix(f.from, f.to, c).toFixed(1)) + '%';
    st.querySelector('.from').style.opacity = k(t, f.t0 + 0.2, f.t0 + 0.35);
    st.querySelector('.arr').style.opacity = k(t, f.t0 + 0.2, f.t0 + 0.35);
    to.style.opacity = k(t, f.t0 + 0.25, f.t0 + 0.35);
    to.style.display = 'inline-block'; to.style.transform = `scale(${1 + punch(t, at, 0.08)})`; to.style.transformOrigin = '100% 80%';
  } else {
    to.textContent = f.big; to.className = /[\u0600-\u06FF]/.test(f.big) ? 'to arb' : 'to'; to.style.display = 'inline-block'; pop(to, t, at, 1.7); to.style.transformOrigin = '100% 80%';
  }
  const nt = $('#fnote'); nt.style.opacity = k(t, at + 0.1, at + 0.3);
  const fade = 1 - k(t, END - 0.08, END);
  for (const e of [$('#fnum'), $('#fcap'), sb, st, nt]) e.style.opacity = Math.min(+e.style.opacity || 0, fade);
  st.style.opacity = fade;
}

function endCard(t) {
  const L = $('#endLogo'), x = k(t, END, END + 0.3, E.outExpo), last = O3 + 3 * PH + 2.345;
  L.style.transform = `scale(${mix(1.3, 1, x) * (1 + punch(t, last, 0.025))})`; L.style.filter = `blur(${(1 - x) * 12}px)`; L.style.opacity = x;
  const b = $('#endBtn .btn');

  b.style.boxShadow = t >= 24.0 ? `0 0 0 ${48 * k(t, 24.0, 24.6)}px rgba(229,57,36,${0.5 * (1 - k(t, 24.0, 24.6))})` : 'none';
  const u = $('#endUrl'); u.style.opacity = k(t, 23.3, 23.5); u.style.transform = `translateY(${(1 - k(t, 23.3, 23.6, E.outExpo)) * 30}px)`;
  const T = [23.54, 23.78, 24.02];
  $$('#chips .chip').forEach((c, i) => { if (t < T[i]) c.style.opacity = 0; else pop(c, t, T[i], 1.5); });
}

function render(t) {
  t = t + 0.02;
  bg(t, t < S1[0] ? 0 : t < O2 + PH ? 0.4 : (t >= DECAY && t < O3 ? 0.4 : 1));
  if (show('L_macro', t < S1[0])) macro(t);
  if (show('L_build', t >= S1[0] && t < O2 + PH)) build(t);
  if (show('L_logo', t >= O2 + PH && t < DECAY)) logo(t);

  $('#flash').style.opacity = flashAt(t, [S1[0], S2[0], O3, END], 0.18, 0.5) + flashAt(t, MT, 0.06, 0.14) + flashAt(t, cuts, 0.07, 0.12)
    + flashAt(t, F.map((f) => f.t0 + 0.9), 0.08, 0.1);

const PRE = [...new Set([...F.flatMap((f) => [`a/${f.a}.jpg`, `a/${f.b}.jpg`]), ...MACROS.map((m) => m[0])])];
window.__keep = PRE.map((src) => { const im = new Image(); im.src = src; return im; });
Promise.all([...['700', '800', '900'].map((w) => document.fonts.load(w + ' 40px Cairo', 'عربي')), document.fonts.load('800 40px Barlow', 'A'), document.fonts.load('500 40px Inter', 'A'), document.fonts.ready])
  .then(() => Promise.all([...document.images, ...window.__keep].map((i) => i.decode().catch(() => 0)))).then(() => { render(0); window.READY = true; });
</script>
