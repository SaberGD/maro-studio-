[package]
name = "horix-one"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "HORIX One for Windows and macOS: Vector and Pixel in one window (the HORIX One web build, served from the app)"

[[bin]]
name = "horix-one"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
rfd = "0.15"
open = "5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
